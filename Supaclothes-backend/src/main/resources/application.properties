spring.application.name=supaclothes
server.port=${PORT:8081}
spring.config.import=optional:file:./Supaclothes-backend/config/supaclothes-local.properties,optional:file:./config/supaclothes-local.properties,optional:file:./Supaclothes-backend/config/supaclothes-neon.properties,optional:file:./config/supaclothes-neon.properties
supaclothes.jwt.secret=${SUPACLOTHES_JWT_SECRET:}
supaclothes.bootstrap.admin-password=${SUPACLOTHES_ADMIN_PASSWORD:}
# Conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supaclothes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
